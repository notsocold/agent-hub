[project]
name = "agent-hub"
version = "0.1.0"
description = "智能体中枢：LangGraph 对话编排 + A2A 多智能体协作 + pgvector 知识检索"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Web / API
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.20",
    # 配置与校验
    "pydantic-settings>=2.15.0",
    # 数据层：业务表 + 向量 + 迁移
    "sqlalchemy[asyncio]>=2.0.54",
    "alembic>=1.20.0",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.5.1",
    # LangChain / LangGraph
    "langchain>=1.4.0,<2.0",
    "langchain-openai>=1.6.2,<2.0",
    "langgraph>=1.2.11,<2.0",
    "langgraph-checkpoint-postgres>=3.2.0,<4.0",
    # Google A2A
    "a2a-sdk[fastapi]>=1.3.0,<2.0",
    # HTTP 客户端（A2A 远程调用、Agent Card 拉取）
    "httpx>=0.28.1",
    # 认证
    "pyjwt>=2.14.0",
    "pwdlib[argon2]>=0.3.1",
    # 知识库（M4）：PDF 解析与 S3 兼容对象存储
    "pypdf>=7.0.0",
    "boto3>=1.43.127",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0",
    "httpx>=0.28.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "TRY", "RUF"]
# 项目规范要求中文注释与中文错误消息，全角标点为自然书写，
# RUF001/RUF002/RUF003 与中文注释规范冲突，故忽略；
# TRY003 要求为长异常消息定义异常类，对中文消息可读性收益低，故忽略。
ignore = ["RUF001", "RUF002", "RUF003", "TRY003"]
